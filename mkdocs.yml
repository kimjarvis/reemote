site_name: reemote5
site_description: >-
  POC model for generator-based two-phase execution: an alternative to
  pyinfra's prepare/execute design.
repo_url: https://github.com/kimjarvis/reemote5
repo_name: kimjarvis/reemote5

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # Besides the installed reemote5 package, the example scripts are
          # importable by file name so docs/examples.md can render their
          # module docstrings (the explanation lives in the example itself).
          paths:
            - examples/modules/apk
            - examples/modules/apt
            - examples/modules/dnf
            - examples/modules/files
            - examples/modules/git
            - examples/modules/hardware
            - examples/modules/server
            - examples/actions
            - examples/general
            - examples/demonstrations/composition
            - examples/demonstrations/connectors
            - examples/demonstrations/inventory
            - examples/demonstrations/privilege
          options:
            docstring_style: google
            show_root_heading: false
            show_source: false
            show_if_no_docstring: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            # Render class/function docstrings, but not the docstrings of
            # UPPERCASE class constants (e.g. FILENAME_MARKER, COMMAND), which
            # are implementation detail rather than part of the documented API.
            filters: ["!^_", "!^[A-Z][A-Z0-9_]*$"]

nav:
  - Home: index.md
  - Guide: guide.md
#  - Examples:
#      - Overview: examples.md
#      - Modules:
#          - apk: examples/modules/apk.md
#          - apt: examples/modules/apt.md
#          - dnf: examples/modules/dnf.md
#          - files: examples/modules/files.md
#          - git: examples/modules/git.md
#          - hardware: examples/modules/hardware.md
#          - server: examples/modules/server.md
#      - General: examples/general.md
#      - Actions: examples/actions.md
#      - Demonstrations:
#          - Composition: examples/demonstrations/composition.md
#          - Connectors: examples/demonstrations/connectors.md
#          - Inventory: examples/demonstrations/inventory.md
#          - Privilege: examples/demonstrations/privilege.md
  - API Reference:
#      - Drivers: drivers.md
#      - Core: core.md
#      - Commands: commands.md
#      - Hosts: hosts.md
      - Modules:
          - apk: modules/apk.md
          - apt: modules/apt.md
          - dnf: modules/dnf.md
          - files: modules/files.md
          - git: modules/git.md
