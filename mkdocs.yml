site_name: reemote
site_url: https://reemote.org/
site_description: >-
  Configure and deploy servers from Python: a generator-based, two-phase
  execution model with pure, idempotent operations.
repo_url: https://github.com/kimjarvis/reemote
repo_name: kimjarvis/reemote

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # Besides the installed reemote package, the example scripts are
          # importable by file name so docs/examples.md can render their
          # module docstrings (the explanation lives in the example itself).
          paths:
            - examples/modules/apk
            - examples/modules/apt
            - examples/modules/dnf
            - examples/modules/files
            - examples/modules/firewalld
            - examples/modules/flatpak
            - examples/modules/git
            - examples/modules/gpg
            - examples/modules/hardware
            - examples/modules/iptables
            - examples/modules/lxd
            - examples/modules/mysql
            - examples/modules/openrc
            - examples/modules/postgresql
            - examples/modules/selinux
            - examples/modules/server
            - examples/modules/snap
            - examples/modules/sysctl
            - examples/modules/systemd
            - examples/modules/ufw
            - examples/actions
            - examples/demonstrations/composition
            - examples/demonstrations/connectors
            - examples/demonstrations/privilege
          options:
            docstring_style: google
            show_root_heading: true
            show_root_toc_entry: true
            heading_level: 2
            show_source: false
            show_if_no_docstring: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_bases: false
            show_symbol_type_heading: true
            # TypedDict fields and command-descriptor fields are documented
            # once (in the class docstring's Attributes table / the class
            # signature); the extension drops their duplicate member entries
            # by kind, so new entry types need no filter updates.
            extensions:
              - scripts/hide_data_fields.py
            # Render class/function docstrings, but not the docstrings of
            # UPPERCASE class constants (e.g. FILENAME_MARKER, COMMAND), which
            # are implementation detail rather than part of the documented API.
            filters:
              - "!^_"
              - "!^[A-Z][A-Z0-9_]*$"
              - "!^(parse|process|command|shell|transfer|wait)$" # fact/descriptor plumbing, not public API
              - "!^(name|group|args|kwargs)$" # Host/OperationRequest/LogEntry/InventoryEntry plumbing fields

