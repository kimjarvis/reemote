site_name: reemote5
site_description: >-
  POC model for generator-based two-phase execution: an alternative to
  pyinfra's prepare/execute design.
repo_url: https://github.com/kimjarvis/reemote5
repo_name: kimjarvis/reemote5

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_root_heading: false
            show_source: false
            show_if_no_docstring: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            filters: ["!^_"]

nav:
  - Home: index.md
  - Guide: guide.md
  - API Reference:
      - Drivers: drivers.md
      - Core: core.md
      - Commands: commands.md
      - Hosts: hosts.md
      - Facts:
          - apt: facts/apt.md
          - files: facts/files.md
      - Operations:
          - apt: operations/apt.md
          - files: operations/files.md
