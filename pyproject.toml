[project]
name = "reemote5"
version = "0.1.0"
description = "POC model for generator-based two-phase execution (an alternative to pyinfra's prepare/execute design)"
readme = "README.md"
authors = [
    { name = "kimjarvis", email = "kim.jarvis@tpfsystems.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
docs = [
    "mkdocs-material>=9.8.0",
    "mkdocstrings[python]>=1.0.8",
    "ruff>=0.9.0",  # used by mkdocstrings to format rendered signatures
]
